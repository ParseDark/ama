name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Resolve version and check existing tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION_TAG="v$(node -p 'require("./package.json").version')"
          TAG="${REQUESTED_TAG:-$VERSION_TAG}"
          if [ "$TAG" != "$VERSION_TAG" ]; then
            echo "Tag $TAG does not match package version $VERSION_TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            # A normal commit keeps producing a build artifact, but must not
            # overwrite a published version. A new package version releases once.
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" > refs.json
            if node -e 'const refs = require("./refs.json"); process.exit(refs.some(r => r.ref === `refs/tags/${process.argv[1]}`) ? 0 : 1)' "$TAG"; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "Pushed tag does not match package version" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Use public registry
        run: |
          printf 'registry=https://registry.npmjs.org/\nlegacy-peer-deps=true\n' > .npmrc
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('pnpm-lock.yaml')
          p.write_text(re.sub(r',?\s*tarball: [^,}\n]+', '', p.read_text()))
          PY
      - run: pnpm install --frozen-lockfile
      - name: Verify version
        run: node --input-type=module -e 'import fs from "node:fs"; if (process.env.TAG !== `v${JSON.parse(fs.readFileSync("package.json")).version}`) process.exit(1)'
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm compile
      - run: python3 -m unittest discover -s tools/embed-server -p 'test_*.py'
      - run: pnpm zip
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: ama-chrome-${{ env.TAG }}
          path: .output/ama-*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .output/ama-*-chrome.zip --clobber
          else
            gh release create "$TAG" .output/ama-*-chrome.zip --target "$(git rev-parse HEAD)" --generate-notes
          fi
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-failure-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
